title: Ship your SaaS at light speed.
description: A production-ready Nuxt starter with a landing page, pricing, docs, blog, changelog and auth flows. Built on Nuxt UI, so every piece is accessible, typed and themeable from one config file.
seo:
  title: Nuxt SaaS Template
  description: Create stunning, fast and production-ready SaaS applications with Nuxt UI. 100+ Vue components, authentication, dark mode, and enterprise features built on Tailwind CSS.
navigation: false
hero:
  headline:
    badge: v4
    label: Built with Nuxt UI
    to: https://ui.nuxt.com
    target: _blank
  links:
    - label: Get started
      icon: i-lucide-arrow-right
      trailing: true
      color: neutral
      size: xl
      to: /docs
    - label: Use this template
      icon: i-simple-icons-github
      color: neutral
      variant: outline
      size: xl
      to: https://github.com/nuxt-ui-templates/saas
      target: _blank
  command: npm create nuxt@latest -- -t ui/saas
logos:
  title: Deploys anywhere Nuxt runs
  items:
    - label: Vercel
      icon: i-simple-icons-vercel
    - label: Netlify
      icon: i-simple-icons-netlify
    - label: Cloudflare
      icon: i-simple-icons-cloudflare
    - label: AWS
      icon: i-simple-icons-amazonwebservices
    - label: Node.js
      icon: i-simple-icons-nodedotjs
    - label: Bun
      icon: i-simple-icons-bun
features:
  headline: 01 / Components
  title: Every piece of a SaaS, already built.
  description: Stop building from scratch. Nuxt UI handles the foundations with tested components and patterns, so your time goes into the features only you can build.
  items:
    - title: 100+ components
      description: From buttons to modals, data tables to forms. Styled with Tailwind CSS and accessible out of the box.
      preview: components
    - title: Authentication ready
      description: Login, signup and password reset flows with validation. Connect your backend and start onboarding users.
      preview: auth
    - title: TypeScript first
      description: Auto-completion and type safety for every prop, slot and composable, right in your editor.
      preview: typescript
    - title: A real design system
      description: Semantic color aliases and design tokens. Rebrand everything from one config file.
      preview: tokens
    - title: Accessible by default
      description: Built on Reka UI. Focus management, keyboard navigation and ARIA handled for you.
      preview: accessibility
    - title: Dark mode ready
      description: Respects system preferences, remembers the user's choice and switches without a flash.
      preview: color-mode
foundations:
  headline: 02 / Foundations
  title: Fast, global and yours to theme.
  features:
    - title: Edge performance
      description: Code splitting, lazy loading and SSR or SSG per route, tuned for Core Web Vitals.
      icon: i-lucide-zap
    - title: Global ready
      description: i18n for 50+ languages with RTL layouts, plus self-hosted fonts through @nuxt/fonts.
      icon: i-lucide-globe
    - title: SEO built in
      description: Meta tags, sitemap and generated Open Graph images for every page.
      icon: i-lucide-search
  code:
    filename: app/app.config.ts
    language: ts
    value: |
      export default defineAppConfig({
        ui: {
          colors: {
            primary: 'green',
            neutral: 'zinc'
          },
          button: {
            defaultVariants: {
              size: 'lg'
            }
          }
        }
      })
  caption: One file to rebrand every page of the template.
testimonials:
  headline: 03 / Developers
  title: Teams ship faster with it.
  items:
    - quote: Nuxt UI transformed how we build. The component quality is exceptional, everything just works with perfect TypeScript support, accessibility, and dark mode built in.
      user:
        name: Sarah Chen
        description: CTO at TechScale Solutions
        avatar:
          src: https://i.pravatar.cc/120?img=1
    - quote: We shipped our MVP in 2 weeks instead of 2 months. The authentication flows and form components saved us countless hours of development time.
      user:
        name: Marcus Rodriguez
        description: VP of Engineering at DataFlow
        avatar:
          src: https://i.pravatar.cc/120?img=7
    - quote: The design system with AppConfig is brilliant. We maintain brand consistency across all our products while leveraging the full component library.
      user:
        name: David Kumar
        description: Security Director at SecureStack
        avatar:
          src: https://i.pravatar.cc/120?img=3
    - quote: From the SaaS template to production in days. The pre-built layouts, navigation, and content structure accelerated our launch.
      user:
        name: Lisa Patel
        description: CEO at AutoScale
        avatar:
          src: https://i.pravatar.cc/120?img=9
    - quote: Reka UI foundation means accessibility is never an afterthought. We achieved WCAG compliance without any custom work.
      user:
        name: Michael Torres
        description: Frontend Lead at AccessFirst
        avatar:
          src: https://i.pravatar.cc/120?img=11
    - quote: We replaced three different UI libraries with Nuxt UI. The consistency and quality across all components is unmatched.
      user:
        name: Thomas Weber
        description: UI Architecture Lead at DesignScale
        avatar:
          src: https://i.pravatar.cc/120?img=12
cta:
  title: Start shipping today.
  description: Get the template, connect your backend and launch. Every page you see here is in the repo.
  links:
    - label: Start building
      color: primary
      size: xl
      icon: i-lucide-arrow-right
      trailing: true
      to: /docs
    - label: View on GitHub
      color: neutral
      variant: outline
      size: xl
      icon: i-simple-icons-github
      to: https://github.com/nuxt-ui-templates/saas
      target: _blank
